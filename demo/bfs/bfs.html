<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFS Shortest Path Demo</title>
    <style>
        body {
            background-color: #222;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        #canvas-container {
            border: 3px solid #ff4444; /* Red border like in the image */
            padding: 10px;
            border-radius: 5px;
        }

        canvas {
            background-color: #333;
            display: block;
            cursor: crosshair;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: flex-start;
            padding-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: transparent;
            border: 2px solid #555;
            color: #eee;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #444;
        }

        button.active {
            background-color: #555;
        }

        #btn-obstacle {
            border-color: #ff4444;
            color: #ff4444;
        }

        #btn-obstacle.active {
            background-color: #ff4444;
            color: white;
        }

        #btn-end {
            border-color: #4488ff;
            color: #4488ff;
        }

        #btn-end.active {
            text-decoration: underline;
        }

        #btn-bfs {
            border: 3px solid white;
            font-weight: bold;
            font-size: 20px;
            padding: 10px 25px;
            border-radius: 10px;
            margin-top: auto; /* Push to the bottom */
        }

        #btn-gradient {
            border: 3px solid white;
            font-weight: bold;
            font-size: 20px;
            padding: 10px 25px;
            border-radius: 10px;
            margin-top: auto; /* Push to the bottom */
        }
    </style>
</head>
<body>

<div class="container">
    <div id="canvas-container">
        <canvas id="gridCanvas" width="400" height="400"></canvas>
    </div>
    <div class="controls">
        <button id="btn-obstacle">obstacle</button>
        <button id="btn-end">end</button>
        <button id="btn-bfs">BFS</button>
        <button id="btn-gradient">Gradient</button>
    </div>
</div>

<script src="bfs.js"></script>

</body>
</html>
