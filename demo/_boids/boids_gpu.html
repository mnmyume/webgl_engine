<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebGL 2 Grid-Based Boids</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #aaa; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
    </style>
</head>
<body>
<div id="ui">
    WebGL 2.0 Pipeline<br>
    1. Scatter (Points -> Grid)<br>
    2. Gather (Grid -> Quad)<br>
    Particles: ~65k | Grid: 64x64
</div>
<canvas id="glcanvas"></canvas>

<script id="scatter-vs" type="x-shader/x-vertex">
    #version 300 es
    // WebGL 2: No attributes needed! We use gl_VertexID.

    uniform sampler2D uParticleTex;
    uniform int uTexSize; // e.g. 256

    out vec2 vVelocity;

    void main() {
        int id = gl_VertexID;
        int width = uTexSize;

        // 1. Calculate UV from Vertex ID
        float u = (float(id % width) + 0.5) / float(width);
        float v = (float(id / width) + 0.5) / float(width);

        // 2. Fetch Particle Data
        vec4 data = texture(uParticleTex, vec2(u, v));
        vec2 pos = data.xy;
        vec2 vel = data.zw;

        // 3. Teleport to Grid Cell
        gl_Position = vec4(pos, 0.0, 1.0);
        gl_PointSize = 1.0;

        vVelocity = vel;
    }
</script>
<script id="scatter-fs" type="x-shader/x-fragment">
    #version 300 es
    precision highp float;

    in vec2 vVelocity;
    out vec4 fragColor;

    void main() {
        // Write Velocity and "1.0" count to the grid
        fragColor = vec4(vVelocity, 1.0, 1.0);
    }
</script>

<script id="gather-vs" type="x-shader/x-vertex">
    #version 300 es
    // Generates a Fullscreen Triangle Strip on the fly
    out vec2 vUV;
    void main() {
        float x = float((gl_VertexID & 1) << 2);
        float y = float((gl_VertexID & 2) << 1);
        vUV = vec2(x * 0.5, y * 0.5);
        gl_Position = vec4(x - 1.0, y - 1.0, 0.0, 1.0);
    }
</script>
<script id="gather-fs" type="x-shader/x-fragment">
    #version 300 es
    precision highp float;

    uniform sampler2D uParticleTex;
    uniform sampler2D uGridTex;

    in vec2 vUV;
    out vec4 fragColor;

    void main() {
        // Read OLD particle state
        vec4 pState = texture(uParticleTex, vUV);
        vec2 pos = pState.xy;
        vec2 vel = pState.zw;

        // --- READ GRID (The "Sensor") ---
        vec2 gridUV = pos * 0.5 + 0.5;
        vec4 gridData = texture(uGridTex, gridUV);

        // Calculate Average Velocity in this cell
        // gridData.z is the mass/count we accumulated
        vec2 avgVel = vec2(0.0);
        if(gridData.z > 0.0) {
            avgVel = gridData.xy / gridData.z;
        }

        // --- PHYSICS ---

        // 1. Alignment (Steer towards local average)
        if(length(avgVel) > 0.0) {
            vel = mix(vel, normalize(avgVel), 0.05);
        }

        // 2. Separation (Avoid High Density)
        // Simple gradient check: Look slightly ahead
        vec4 neighborData = texture(uGridTex, gridUV + vel * 0.01);
        if(neighborData.z > gridData.z) {
            // If ahead is crowded, turn random/away
            vel.x += (gridUV.x - 0.5) * 0.1;
            vel.y += (gridUV.y - 0.5) * 0.1;
        }

        // 3. Integration
        pos += vel * 0.005;

        // 4. Boundary Wrap
        if(pos.x > 1.0) pos.x = -1.0;
        if(pos.x < -1.0) pos.x = 1.0;
        if(pos.y > 1.0) pos.y = -1.0;
        if(pos.y < -1.0) pos.y = 1.0;

        vel = normalize(vel); // Keep constant speed

        fragColor = vec4(pos, vel);
    }
</script>

<script id="render-vs" type="x-shader/x-vertex">
    #version 300 es
    uniform sampler2D uParticleTex;
    uniform int uTexSize;
    out vec2 vVel;

    void main() {
        int id = gl_VertexID;
        int width = uTexSize;
        float u = (float(id % width) + 0.5) / float(width);
        float v = (float(id / width) + 0.5) / float(width);

        vec4 data = texture(uParticleTex, vec2(u, v));

        gl_Position = vec4(data.xy, 0.0, 1.0);
        gl_PointSize = 2.0;
        vVel = data.zw;
    }
</script>
<script id="render-fs" type="x-shader/x-fragment">
    #version 300 es
    precision highp float;
    in vec2 vVel;
    out vec4 fragColor;
    void main() {
        // Color based on direction
        vec3 col = vec3(vVel * 0.5 + 0.5, 1.0);
        fragColor = vec4(col, 1.0);
    }
</script>

<script>
    const canvas = document.getElementById("glcanvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 1. Init WebGL 2
    const gl = canvas.getContext("webgl2");
    if (!gl) { alert("WebGL 2 not supported"); }

    // CRITICAL: Enable Floating Point Textures for WebGL 2
    // Unlike WebGL 1, this needs specific extensions for FBOs
    const ext = gl.getExtension("EXT_color_buffer_float");
    if (!ext) { alert("Need EXT_color_buffer_float"); }

    // --- CONFIG ---
    const P_SIZE = 256; // 256x256 = 65,536 Particles
    const GRID_SIZE = 64; // 64x64 Grid Cells

    // --- HELPER: Compile Shader ---
    function createProgram(vsId, fsId) {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, document.getElementById(vsId).text.trim());
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(vs));

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, document.getElementById(fsId).text.trim());
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(fs));

        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        return prog;
    }

    // --- HELPER: Create Texture ---
    function createTexture(w, h, data) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, data);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        return tex;
    }

    // --- INIT DATA ---
    const pData = new Float32Array(P_SIZE * P_SIZE * 4);
    for(let i=0; i<pData.length; i+=4) {
        pData[i] = Math.random() * 2 - 1;   // X
        pData[i+1] = Math.random() * 2 - 1; // Y
        pData[i+2] = Math.random() - 0.5;   // VX
        pData[i+3] = Math.random() - 0.5;   // VY
    }

    // --- SETUP FBOs ---
    // 1. Grid FBO (Single Buffer)
    const gridTex = createTexture(GRID_SIZE, GRID_SIZE, null);
    const gridFBO = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, gridFBO);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gridTex, 0);

    // 2. Particle FBOs (Ping-Pong)
    const pTexA = createTexture(P_SIZE, P_SIZE, pData);
    const pFBOA = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, pFBOA);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pTexA, 0);

    const pTexB = createTexture(P_SIZE, P_SIZE, null);
    const pFBOB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, pFBOB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pTexB, 0);

    // --- PROGRAMS ---
    const progScatter = createProgram("scatter-vs", "scatter-fs");
    const progGather = createProgram("gather-vs", "gather-fs");
    const progRender = createProgram("render-vs", "render-fs");

    // --- STATE VARS ---
    let readFBO = pFBOA;
    let readTex = pTexA;
    let writeFBO = pFBOB;
    let writeTex = pTexB;

    function loop() {
        // ============================================
        // STEP 1: SCATTER (Draw Points onto Grid)
        // ============================================
        gl.bindFramebuffer(gl.FRAMEBUFFER, gridFBO);
        gl.viewport(0, 0, GRID_SIZE, GRID_SIZE);
        gl.clearColor(0,0,0,0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(progScatter);
        gl.uniform1i(gl.getUniformLocation(progScatter, "uParticleTex"), 0);
        gl.uniform1i(gl.getUniformLocation(progScatter, "uTexSize"), P_SIZE);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, readTex);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);

        // WebGL 2: Draw using gl_VertexID, no buffers needed!
        gl.drawArrays(gl.POINTS, 0, P_SIZE * P_SIZE);

        gl.disable(gl.BLEND);

        // ============================================
        // STEP 2: GATHER (Update Particles)
        // ============================================
        gl.bindFramebuffer(gl.FRAMEBUFFER, writeFBO);
        gl.viewport(0, 0, P_SIZE, P_SIZE);

        gl.useProgram(progGather);
        gl.uniform1i(gl.getUniformLocation(progGather, "uParticleTex"), 0);
        gl.uniform1i(gl.getUniformLocation(progGather, "uGridTex"), 1);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, readTex);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, gridTex);

        // Draw full screen triangle (3 verts)
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // ============================================
        // STEP 3: RENDER TO SCREEN
        // ============================================
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(progRender);
        gl.uniform1i(gl.getUniformLocation(progRender, "uParticleTex"), 0);
        gl.uniform1i(gl.getUniformLocation(progRender, "uTexSize"), P_SIZE);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, writeTex); // Read from the NEW state

        gl.drawArrays(gl.POINTS, 0, P_SIZE * P_SIZE);

        // ============================================
        // SWAP
        // ============================================
        let tempFBO = readFBO; readFBO = writeFBO; writeFBO = tempFBO;
        let tempTex = readTex; readTex = writeTex; writeTex = tempTex;

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
